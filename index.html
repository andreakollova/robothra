<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Robot: The Learning Factory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #ECEAE4;
      -webkit-font-smoothing: antialiased;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 30, 45, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
    }

    .ui-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 4px 16px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      overflow-y: auto;
      animation: panelIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .ui-btn {
      display: inline-block;
      padding: 11px 22px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      text-align: center;
      width: 100%;
      letter-spacing: 0.01em;
    }

    .ui-btn.primary {
      background: linear-gradient(135deg, #4A7AE8, #3564D8);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(53, 100, 216, 0.25);
    }

    .ui-btn.primary:hover {
      background: linear-gradient(135deg, #3564D8, #2850B8);
      box-shadow: 0 4px 14px rgba(53, 100, 216, 0.35);
      transform: translateY(-1px);
    }

    .ui-btn.secondary {
      background: #F4F5F7;
      color: #4A5568;
      border: 1px solid #E2E5EA;
    }

    .ui-btn.secondary:hover {
      background: #EBEDF0;
      border-color: #CBD0D8;
    }

    .ui-btn.danger {
      background: #FFF0F0;
      color: #D32F2F;
      border: 1px solid #FECACA;
    }

    .ui-btn.danger:hover {
      background: #FEE2E2;
    }

    .ui-btn:focus {
      outline: 2px solid #3564D8;
      outline-offset: 2px;
    }

    .ui-btn:active {
      transform: scale(0.98);
    }

    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1.5px solid #E2E5EA;
      border-radius: 12px;
      background: #FAFBFC;
      cursor: pointer;
      font-size: 14px;
      color: #1A2B3C;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      width: 100%;
      line-height: 1.5;
    }

    .quiz-option:hover {
      border-color: #93B4F5;
      background: #F0F4FF;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(53, 100, 216, 0.08);
    }

    .quiz-option.selected {
      border-color: #3564D8;
      background: #EDF1FF;
      box-shadow: 0 0 0 3px rgba(53, 100, 216, 0.1);
    }

    .quiz-option:focus {
      outline: 2px solid #3564D8;
      outline-offset: 1px;
    }

    .option-label {
      font-weight: 700;
      color: #3564D8;
      flex-shrink: 0;
      min-width: 22px;
      font-size: 15px;
    }

    .tab-btn {
      padding: 7px 16px;
      border: 1.5px solid #E2E5EA;
      border-radius: 10px;
      background: #FAFBFC;
      font-size: 12px;
      font-weight: 600;
      color: #627185;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4A7AE8, #3564D8);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 2px 6px rgba(53, 100, 216, 0.2);
    }

    .tab-btn:hover:not(.active) {
      background: #F0F4FF;
      border-color: #93B4F5;
    }

    textarea:focus {
      border-color: #3564D8 !important;
      box-shadow: 0 0 0 3px rgba(53, 100, 216, 0.1);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #DCE3E8;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B0B8C0;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
